# Build and attach the plugin zip when you push a version tag (e.g. v1.3.1).
# Uses Windows + Compress-Archive so the release zip matches local .\scripts\build-plugin-package.ps1
# and the checksum you commit in manifest.json (same as a typical dev machine).

name: Release plugin package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Create zip (PowerShell; matches build-plugin-package.ps1)
        id: pack
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v',''
          if ($tag -match '^\d+\.\d+\.\d+$') {
            $jfver = "$tag.0"
          } else {
            $jfver = $tag
          }
          $zipName = "live-matches_${jfver}.zip"
          $bin = Join-Path $env:GITHUB_WORKSPACE "bin\Release\net9.0"
          $dll = Join-Path $bin "Jellyfin.Plugin.StreamedPk.dll"
          $meta = Join-Path $bin "meta.json"
          $thumb = Join-Path $bin "channel-thumb.png"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Compress-Archive -Path $dll, $meta, $thumb -DestinationPath $zipPath -Force
          $md5 = (Get-FileHash -Path $zipPath -Algorithm MD5).Hash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_name=$zipName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "md5=$md5"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Package: $zipName"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**MD5:** ``$md5``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Ensure ``manifest.json`` lists this checksum for this version so Jellyfin catalog installs succeed."

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip_name }}
          generate_release_notes: true
